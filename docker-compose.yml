services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autotechdealsx
      POSTGRES_USER: autotech
      POSTGRES_PASSWORD: autotech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotech -d autotechdealsx"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python scripts/seed.py && gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    depends_on:
      - backend
      - redis
      - postgres
    command: celery -A app.core.celery_app.celery_app worker --loglevel=INFO

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    depends_on:
      - backend
      - redis
      - postgres
    command: celery -A app.core.celery_app.celery_app beat --loglevel=INFO

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
