services:
  - type: keyvalue
    name: autotechdealsx-redis
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: autotechdealsx-api
    runtime: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    dockerCommand: sh -c "alembic upgrade head && python scripts/seed.py && gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autotechdealsx-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: autotechdealsx-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: PUBLIC_BASE_URL
        value: https://autotechdealsx-web.onrender.com
      - key: CORS_ORIGINS
        value: https://autotechdealsx-web.onrender.com
      - key: PUBLISH_MODE
        value: semi_automatic
      - key: PUBLISH_DRY_RUN
        value: "true"
      - key: CRON_SECRET
        sync: false
      - key: MIN_DISCOUNT_PERCENT
        value: "15"
      - key: AMAZON_ASSOCIATE_TAG
        sync: false
      - key: MERCADO_LIVRE_AFFILIATE_ID
        sync: false
      - key: MERCADO_LIVRE_TOOL_ID
        sync: false
      - key: ALIEXPRESS_AFFILIATE_ID
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_TOKEN_SECRET
        sync: false
      - key: X_BEARER_TOKEN
        sync: false

  - type: worker
    name: autotechdealsx-worker
    runtime: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    dockerCommand: celery -A app.core.celery_app.celery_app worker --loglevel=INFO
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autotechdealsx-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: autotechdealsx-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: PUBLISH_MODE
        value: semi_automatic
      - key: PUBLISH_DRY_RUN
        value: "true"
      - key: CRON_SECRET
        sync: false
      - key: MIN_DISCOUNT_PERCENT
        value: "15"
      - key: AMAZON_ASSOCIATE_TAG
        sync: false
      - key: MERCADO_LIVRE_AFFILIATE_ID
        sync: false
      - key: MERCADO_LIVRE_TOOL_ID
        sync: false
      - key: ALIEXPRESS_AFFILIATE_ID
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_TOKEN_SECRET
        sync: false
      - key: X_BEARER_TOKEN
        sync: false

  - type: worker
    name: autotechdealsx-scheduler
    runtime: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    dockerCommand: celery -A app.core.celery_app.celery_app beat --loglevel=INFO
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autotechdealsx-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: autotechdealsx-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: PUBLISH_MODE
        value: semi_automatic
      - key: PUBLISH_DRY_RUN
        value: "true"
      - key: CRON_SECRET
        sync: false
      - key: MIN_DISCOUNT_PERCENT
        value: "15"

  - type: web
    name: autotechdealsx-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://autotechdealsx-api.onrender.com/api/v1

databases:
  - name: autotechdealsx-db
    databaseName: autotechdealsx
    user: autotech
